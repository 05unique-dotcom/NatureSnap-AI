<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NatureSnap AI</title>
<style>
:root {
  --sage: #dce8d8;
  --sage-dark: #426b50;
  --forest: #234b35;
  --cream: #fbf8ef;
  --card: #fffef9;
  --ink: #25372c;
  --muted: #68776b;
  --line: #e1e8dc;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--cream);
  color: var(--ink);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
  line-height: 1.6;
}
header {
  padding: 30px 18px;
  text-align: center;
  color: #fffdf5;
  background: linear-gradient(135deg, #234b35, #477858);
}
header h1 { margin: 0; font-size: clamp(1.7rem, 6vw, 2.35rem); letter-spacing: -0.04em; }
header p { margin: 8px 0 0; color: #e3eee0; }
main {
  width: min(100% - 28px, 680px);
  margin: 28px auto;
}
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 24px;
  padding: clamp(18px, 5vw, 30px);
  box-shadow: 0 12px 38px rgba(37, 67, 44, .08);
}
h2 { margin-top: 0; color: var(--forest); letter-spacing: -.025em; }
p { overflow-wrap: anywhere; }
input[type="file"] {
  display: block; width: 100%; margin: 18px 0;
  padding: 12px; border: 1px dashed #9eb49c;
  border-radius: 14px; background: #f5f7ef; color: var(--ink);
}
img {
  display: block; width: 100%; max-height: 390px;
  object-fit: contain; margin: 18px auto;
  border-radius: 18px; background: #f0f3eb;
}
button {
  display: block; width: 100%; min-height: 52px;
  border: 0; border-radius: 15px; padding: 14px 18px;
  background: var(--forest); color: white;
  font: inherit; font-weight: 700; cursor: pointer;
  box-shadow: 0 5px 14px rgba(35, 75, 53, .18);
  transition: transform .15s, background .15s;
}
button:hover { background: var(--sage-dark); }
button:active { transform: scale(.99); }
#result {
  margin-top: 22px; padding: 20px;
  border: 1px solid var(--line); border-radius: 18px;
  background: #f0f6ed; overflow-wrap: anywhere;
}
footer { text-align: center; padding: 8px 16px 28px; color: var(--muted); font-size: .85rem; }
@media (min-width: 600px) {
  main { margin-top: 38px; }
}

#result p { margin: 0 0 14px; line-height: 1.75; }
#result p:last-child { margin-bottom: 0; }
#result h2, #result h3 { color: #234b35; margin: 18px 0 8px; }
#result strong { color: #234b35; font-weight: 750; }
#result em { font-style: italic; }


#result{white-space:normal}
.ai-sec{background:#fff;border:1px solid #d9eadb;border-radius:14px;padding:14px 16px;margin:12px 0;text-align:left;box-shadow:0 2px 8px rgba(31,107,58,.06)}
.ai-h{margin:0 0 10px;font-size:17px;color:#1f6b3a;display:flex;align-items:center;gap:8px}
.ai-ic{font-size:20px}
.ai-p{margin:6px 0;line-height:1.6}
.ai-item{display:flex;flex-direction:column;gap:2px;padding:10px 12px;margin:8px 0;background:#f3faf4;border-left:4px solid #1f6b3a;border-radius:8px;line-height:1.55}
.ai-label{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#2f7d4a}
.ai-value em{font-style:italic;color:#15512b}

/*ai-fix3*/
#preview:not([src]),#preview[src=""]{display:none!important}
#result:has(.ai-sec){background:transparent;border:0;box-shadow:none;padding:0}
.ai-h{align-items:flex-start;line-height:1.3}
.ai-ic{flex:0 0 auto;line-height:1.3}
</style>
</head>
<body>
<header>
<h1>🌿 NatureSnap AI</h1>
<p>Snap nature. Discover nature. Touch grass.</p>
</header>
<main>
<div class="card">
<h2>🔍 Discover Nature</h2>
<p>Upload a photo of a plant, flower, bird, or other natural object.</p>
<input type="file" id="imageInput" accept="image/*">
<img id="preview" alt="preview">
<button id="analyzeBtn">✨ Analyze with AI</button>
<div id="result">Your AI-generated nature report will appear here.</div>
<div id="status">JS not loaded</div>
</div>
</main>
<script>
var imageInput = document.getElementById("imageInput");
var preview = document.getElementById("preview");
var result = document.getElementById("result");
var statusEl = document.getElementById("status");

statusEl.style.display = "none";

window.onerror = function (msg) {
  result.textContent = "JS error: " + msg;
  };

  imageInput.addEventListener("change", function () {
    var file = imageInput.files[0];
      if (file) {
          preview.src = URL.createObjectURL(file);
              preview.style.display = "block";
                }
                });

                
function resizeImage(file) {
  return new Promise(function (resolve) {
    if (!file || !file.type || file.type.indexOf("image/") !== 0) { resolve(file); return; }
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      var w = img.naturalWidth, h = img.naturalHeight;
      var scale = Math.min(1, 1280 / Math.max(w, h));
      if (scale === 1 && file.size < 1500000) { URL.revokeObjectURL(url); resolve(file); return; }
      var c = document.createElement("canvas");
      c.width = Math.round(w * scale);
      c.height = Math.round(h * scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(function (b) { URL.revokeObjectURL(url); resolve(b || file); }, "image/jpeg", 0.85);
    };
    img.onerror = function () { URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
}

function formatAnalysis(raw) {
  const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  const inline = s => esc(s)
    .replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
    .replace(/\*([^*\n]+?)\*/g,"<em>$1</em>")
    .replace(/\*+/g,"");
  const iconFor = t => {
    if (/name|identif|species/i.test(t)) return "🌿";
    if (/fact|know|trivia/i.test(t)) return "💡";
    if (/activit|challenge|outdoor|try/i.test(t)) return "🚶";
    if (/care|tip|habitat|where/i.test(t)) return "🌱";
    return "📌";
  };
  const sections = [];
  let cur = { title: "", intro: [], items: [] };
  sections.push(cur);
  String(raw).replace(/\r/g,"").split("\n").forEach(line => {
    const l = line.trim();
    if (!l) return;
    const h = l.match(/^(?:#{1,4}\s*)?(?:\*\*)?\s*\d+[\).]\s*(.+?)\s*$/);
    if (h) {
      const title = h[1].replace(/\*+/g,"").replace(/:\s*$/,"").trim();
      if (title.length <= 40 && !/[.!?]$/.test(title)) {
        cur = { title: title, intro: [], items: [] };
        sections.push(cur);
        return;
      }
    }
    const md = l.match(/^#{1,4}\s*(.+)$/);
    if (md) {
      cur = { title: md[1].replace(/\*+/g,"").replace(/:\s*$/,""), intro: [], items: [] };
      sections.push(cur);
      return;
    }
    const b = l.match(/^(?:[*\-•]\s+|\d+[\).]\s+)(.+)$/);
    if (b) { cur.items.push(b[1]); return; }
    if (/^\*\*.+?\*\*/.test(l)) { cur.items.push(l); return; }
    cur.intro.push(l);
  });
  const item = t => {
    let label = "", value = t;
    let m = t.match(/^\*\*(.+?)\*\*\s*(.*)$/);
    if (m) { label = m[1]; value = m[2]; }
    else {
      m = t.match(/^\*?([A-Za-z][A-Za-z '’\-]{1,28}?):\*?\s+(.+)$/);
      if (m) { label = m[1]; value = m[2]; }
    }
    label = label.replace(/[*:]+\s*$/,"").replace(/^\*+/,"").trim();
    value = value.replace(/^[:\s*]+/,"");
    const sci = /scientific|latin|botanical/i.test(label);
    const v = sci ? "<em>" + esc(value.replace(/\*+/g,"")) + "</em>" : inline(value);
    return '<div class="ai-item">' +
      (label ? '<span class="ai-label">' + esc(label) + '</span>' : '') +
      '<span class="ai-value">' + v + '</span></div>';
  };
  return sections.map(sec => {
    if (!sec.title && !sec.intro.length && !sec.items.length) return "";
    let html = '<section class="ai-sec">';
    if (sec.title) html += '<h3 class="ai-h"><span class="ai-ic">' + iconFor(sec.title) + '</span>' + esc(sec.title) + '</h3>';
    sec.intro.forEach(x => { html += '<p class="ai-p">' + inline(x) + '</p>'; });
    sec.items.forEach(x => { html += item(x); });
    return html + '</section>';
  }).join("");
}
document.getElementById("analyzeBtn").addEventListener("click", async function () {
                  if (!imageInput.files.length) {
                      result.textContent = "Pehle ek photo chuno.";
                          return;
                            }
                              result.textContent = "Analyzing photo...";
                                try {
                                    var fd = new FormData();
                                        fd.append("image", await resizeImage(imageInput.files[0]), "photo.jpg");
                                            var res = await fetch("/api/analyze", { method: "POST", body: fd });
                                                var data = await res.json();
                                                    if (!res.ok) {
                                                          result.textContent = "Error: " + (data.error || res.status);
                                                                return;
                                                                    }
                                                                        result.innerHTML = formatAnalysis(data.analysis || JSON.stringify(data));
                                                                          } catch (e) {
                                                                              result.textContent = "AI error: " + e.message;
                                                                                }
                                                                                });
                                                                                </script>
                                                                                </body>
                                                                                </html>
