<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>NatureSnap AI</title>

        <style>
            * {
                  box-sizing: border-box;
                      }

                          body {
                                margin: 0;
                                      font-family: Arial, sans-serif;
                                            background: #eef7ee;
                                                  color: #183a1d;
                                                      }

                                                          header {
                                                                text-align: center;
                                                                      padding: 35px 20px;
                                                                            background: #1f6b3a;
                                                                                  color: white;
                                                                                      }

                                                                                          header h1 {
                                                                                                margin: 0;
                                                                                                      font-size: 42px;
                                                                                                          }

                                                                                                              header p {
                                                                                                                    font-size: 18px;
                                                                                                                        }

                                                                                                                            main {
                                                                                                                                  max-width: 800px;
                                                                                                                                        margin: 35px auto;
                                                                                                                                              padding: 20px;
                                                                                                                                                  }

                                                                                                                                                      .card {
                                                                                                                                                            background: white;
                                                                                                                                                                  padding: 30px;
                                                                                                                                                                        border-radius: 18px;
                                                                                                                                                                              box-shadow: 0 5px 20px rgba(0,0,0,0.1);
                                                                                                                                                                                    text-align: center;
                                                                                                                                                                                        }

                                                                                                                                                                                            input[type="file"] {
                                                                                                                                                                                                  margin: 20px 0;
                                                                                                                                                                                                        padding: 12px;
                                                                                                                                                                                                              width: 100%;
                                                                                                                                                                                                                  }

                                                                                                                                                                                                                      button {
                                                                                                                                                                                                                            background: #1f6b3a;
                                                                                                                                                                                                                                  color: white;
                                                                                                                                                                                                                                        border: none;
                                                                                                                                                                                                                                              padding: 14px 25px;
                                                                                                                                                                                                                                                    border-radius: 10px;
                                                                                                                                                                                                                                                          font-size: 16px;
                                                                                                                                                                                                                                                                cursor: pointer;
                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                        button:hover {
                                                                                                                                                                                                                                                                              background: #15512b;
                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                      #preview {
                                                                                                                                                                                                                                                                                            max-width: 100%;
                                                                                                                                                                                                                                                                                                  max-height: 350px;
                                                                                                                                                                                                                                                                                                        margin: 20px auto;
                                                                                                                                                                                                                                                                                                              border-radius: 15px;
                                                                                                                                                                                                                                                                                                                    display: none;
                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                            #result {
                                                                                                                                                                                                                                                                                                                                  margin-top: 25px;
                                                                                                                                                                                                                                                                                                                                        padding: 20px;
                                                                                                                                                                                                                                                                                                                                              background: #f0f8f0;
                                                                                                                                                                                                                                                                                                                                                    border-radius: 12px;
                                                                                                                                                                                                                                                                                                                                                          display: none;
                                                                                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                                                                                  .activity {
                                                                                                                                                                                                                                                                                                                                                                        margin-top: 15px;
                                                                                                                                                                                                                                                                                                                                                                              font-weight: bold;
                                                                                                                                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                                                                                                                                    </style>
                                                                                                                                                                                                                                                                                                                                                                                    </head>

                                                                                                                                                                                                                                                                                                                                                                                    <body>

                                                                                                                                                                                                                                                                                                                                                                                      <header>
                                                                                                                                                                                                                                                                                                                                                                                          <h1>🌿 NatureSnap AI</h1>
                                                                                                                                                                                                                                                                                                                                                                                              <p>Snap nature. Discover nature. Touch grass.</p>
                                                                                                                                                                                                                                                                                                                                                                                                </header>

                                                                                                                                                                                                                                                                                                                                                                                                  <main>
                                                                                                                                                                                                                                                                                                                                                                                                      <div class="card">

                                                                                                                                                                                                                                                                                                                                                                                                            <h2>🔍 Discover Nature</h2>

                                                                                                                                                                                                                                                                                                                                                                                                                  <p>
                                                                                                                                                                                                                                                                                                                                                                                                                          Upload a photo of a plant, flower, bird, or other natural object.
                                                                                                                                                                                                                                                                                                                                                                                                                                </p>

                                                                                                                                                                                                                                                                                                                                                                                                                                      <input
                                                                                                                                                                                                                                                                                                                                                                                                                                              type="file"
                                                                                                                                                                                                                                                                                                                                                                                                                                                      id="imageInput"
                                                                                                                                                                                                                                                                                                                                                                                                                                                              accept="image/*"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    >

                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <img id="preview" alt="Nature preview">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <button onclick="analyzeNature()">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        ✨ Analyze with AI
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </button>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div id="result"></div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </main>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const imageInput = document.getElementById("imageInput");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const preview = document.getElementById("preview");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const result = document.getElementById("result");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            imageInput.addEventListener("change", function () {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const file = this.files[0];

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (file) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                preview.src = URL.createObjectURL(file);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        preview.style.display = "block";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      function analyzeNature() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (!imageInput.files.length) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    alert("Please upload a nature photo first 🌱");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        result.style.display = "block";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              result.innerHTML = `
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <h2>🌿 Nature Discovery</h2>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        Your photo is ready for AI analysis!
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </p>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  🤖 AI identification will appear here.
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </p>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            📚 You will also get interesting facts about what you discovered.
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </p>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="activity">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      🚶 Outdoor Challenge:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                Spend 20 minutes outside and try to find
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          3 different plants or natural objects.
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        `;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </html>
