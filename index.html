<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NatureSnap AI</title>
<style>
:root {
  --sage: #dce8d8;
  --sage-dark: #426b50;
  --forest: #234b35;
  --cream: #fbf8ef;
  --card: #fffef9;
  --ink: #25372c;
  --muted: #68776b;
  --line: #e1e8dc;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--cream);
  color: var(--ink);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
  line-height: 1.6;
}
header {
  padding: 30px 18px;
  text-align: center;
  color: #fffdf5;
  background: linear-gradient(135deg, #234b35, #477858);
}
header h1 { margin: 0; font-size: clamp(1.7rem, 6vw, 2.35rem); letter-spacing: -0.04em; }
header p { margin: 8px 0 0; color: #e3eee0; }
main {
  width: min(100% - 28px, 680px);
  margin: 28px auto;
}
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 24px;
  padding: clamp(18px, 5vw, 30px);
  box-shadow: 0 12px 38px rgba(37, 67, 44, .08);
}
h2 { margin-top: 0; color: var(--forest); letter-spacing: -.025em; }
p { overflow-wrap: anywhere; }
input[type="file"] {
  display: block; width: 100%; margin: 18px 0;
  padding: 12px; border: 1px dashed #9eb49c;
  border-radius: 14px; background: #f5f7ef; color: var(--ink);
}
img {
  display: block; width: 100%; max-height: 390px;
  object-fit: contain; margin: 18px auto;
  border-radius: 18px; background: #f0f3eb;
}
button {
  display: block; width: 100%; min-height: 52px;
  border: 0; border-radius: 15px; padding: 14px 18px;
  background: var(--forest); color: white;
  font: inherit; font-weight: 700; cursor: pointer;
  box-shadow: 0 5px 14px rgba(35, 75, 53, .18);
  transition: transform .15s, background .15s;
}
button:hover { background: var(--sage-dark); }
button:active { transform: scale(.99); }
#result {
  margin-top: 22px; padding: 20px;
  border: 1px solid var(--line); border-radius: 18px;
  background: #f0f6ed; overflow-wrap: anywhere;
}
footer { text-align: center; padding: 8px 16px 28px; color: var(--muted); font-size: .85rem; }
@media (min-width: 600px) {
  main { margin-top: 38px; }
}

#result p { margin: 0 0 14px; line-height: 1.75; }
#result p:last-child { margin-bottom: 0; }
#result h2, #result h3 { color: #234b35; margin: 18px 0 8px; }
#result strong { color: #234b35; font-weight: 750; }
#result em { font-style: italic; }

</style>
</head>
<body>
<header>
<h1>🌿 NatureSnap AI</h1>
<p>Snap nature. Discover nature. Touch grass.</p>
</header>
<main>
<div class="card">
<h2>🔍 Discover Nature</h2>
<p>Upload a photo of a plant, flower, bird, or other natural object.</p>
<input type="file" id="imageInput" accept="image/*">
<img id="preview" alt="preview">
<button id="analyzeBtn">✨ Analyze with AI</button>
<div id="result">Result yahan dikhega.</div>
<div id="status">JS not loaded</div>
</div>
</main>
<script>
var imageInput = document.getElementById("imageInput");
var preview = document.getElementById("preview");
var result = document.getElementById("result");
var statusEl = document.getElementById("status");

statusEl.textContent = "Your botanical discovery will appear here after analysis.";

window.onerror = function (msg) {
  result.textContent = "JS error: " + msg;
  };

  imageInput.addEventListener("change", function () {
    var file = imageInput.files[0];
      if (file) {
          preview.src = URL.createObjectURL(file);
              preview.style.display = "block";
                }
                });

                
function formatAnalysis(raw) {
  const esc = s => String(s).replace(/&/g,"&amp;")
    .replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  let t = esc(raw);
  t = t.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  t = t.replace(/\*([^*\n]+)\*/g, "<em>$1</em>");
  t = t.replace(/^### (.+)$/gm, "<h3>$1</h3>");
  t = t.replace(/^## (.+)$/gm, "<h2>$1</h2>");
  t = t.replace(/^\s*[-•]\s+(.+)$/gm, "• $1");
  return t.split(/\n{2,}/).map(x => "<p>" +
    x.replace(/\n/g,"<br>") + "</p>").join("");
}

document.getElementById("analyzeBtn").addEventListener("click", async function () {
                  if (!imageInput.files.length) {
                      result.textContent = "Pehle ek photo chuno.";
                          return;
                            }
                              result.textContent = "Analyzing photo...";
                                try {
                                    var fd = new FormData();
                                        fd.append("image", imageInput.files[0]);
                                            var res = await fetch("/api/analyze", { method: "POST", body: fd });
                                                var data = await res.json();
                                                    if (!res.ok) {
                                                          result.textContent = "Error: " + (data.error || res.status);
                                                                return;
                                                                    }
                                                                        result.innerHTML = formatAnalysis(data.analysis || JSON.stringify(data));
                                                                          } catch (e) {
                                                                              result.textContent = "AI error: " + e.message;
                                                                                }
                                                                                });
                                                                                </script>
                                                                                </body>
                                                                                </html>
